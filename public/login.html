<!DOCTYPE html>
<html lang="fr">
<head>
  <script>(function(){var h=location.hostname;if(location.port==="6000"&&h!=="localhost"&&h!=="127.0.0.1"){location.replace(location.protocol+"//"+h+location.pathname+location.search+location.hash);}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin | TMK Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --border-color: #2a2a3a;
      --text-primary: #ffffff;
      --text-secondary: #8b8b9e;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-success: #22c55e;
      --accent-danger: #ef4444;
      --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Background Effects */
    .bg-effects {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-gradient-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      top: -200px;
      right: -100px;
      animation: float 20s ease-in-out infinite;
    }

    .bg-gradient-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      bottom: -150px;
      left: -100px;
      animation: float 25s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -50px) scale(1.1); }
    }

    /* Login Container */
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .logo-section {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: var(--gradient-primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      color: white;
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
    }

    .logo-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    /* Login Card */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* Form */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    .form-input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .form-input:focus + i,
    .input-wrapper:focus-within i {
      color: var(--accent-primary);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.7;
    }

    /* Password Toggle */
    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.25rem;
      transition: color 0.3s ease;
    }

    .password-toggle:hover {
      color: var(--accent-primary);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: var(--gradient-primary);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-submit .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Error Message */
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.75rem;
      color: var(--accent-danger);
      font-size: 0.9rem;
    }

    .error-message.show {
      display: flex;
    }

    .error-message i {
      font-size: 1.2rem;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .login-footer a {
      color: var(--accent-primary);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .login-footer a:hover {
      color: var(--accent-secondary);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 1rem;
      }

      .login-card {
        padding: 1.5rem;
      }

      .logo {
        width: 60px;
        height: 60px;
        font-size: 1.5rem;
      }

      .logo-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-effects">
    <div class="bg-gradient-1"></div>
    <div class="bg-gradient-2"></div>
  </div>

  <div class="login-container">
    <div class="logo-section">
      <div class="logo">
        <i class="fas fa-crown"></i>
      </div>
      <h1 class="logo-title">TMK Foundation</h1>
      <p class="logo-subtitle">Panneau d'Administration</p>
    </div>

    <div class="login-card">
      <div class="login-header">
        <h1>Bienvenue</h1>
        <p>Connectez-vous pour accéder à l'administration</p>
      </div>

      <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText"></span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Adresse email</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              class="form-input" 
              id="email" 
              placeholder="votre@email.com"
              required
              autocomplete="email"
            >
            <i class="fas fa-envelope"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              class="form-input" 
              id="password" 
              placeholder="••••••••"
              required
              autocomplete="current-password"
            >
            <i class="fas fa-lock"></i>
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span id="btnText">Se connecter</span>
          <i class="fas fa-arrow-right" id="btnIcon"></i>
        </button>
      </form>

      <div class="login-footer">
        <a href="/">← Retour au site</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    // Toggle password visibility
    function togglePassword() {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      document.getElementById('toggleIcon').className = 
        type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    }

    // Show error
    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.add('show');
    }

    // Hide error
    function hideError() {
      errorMessage.classList.remove('show');
    }

    // Set loading state
    function setLoading(loading) {
      submitBtn.disabled = loading;
      if (loading) {
        btnText.textContent = 'Connexion...';
        btnIcon.className = 'spinner';
      } else {
        btnText.textContent = 'Se connecter';
        btnIcon.className = 'fas fa-arrow-right';
      }
    }

    // Handle form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      setLoading(true);

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: emailInput.value,
            password: passwordInput.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erreur de connexion');
        }

        // Stocker le token dans localStorage pour les appels API
        localStorage.setItem('authToken', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Rediriger vers le dashboard admin
        window.location.href = '/admin';

      } catch (error) {
        showError(error.message);
      } finally {
        setLoading(false);
      }
    });

    // Check if already logged in
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('authToken');
      if (token) {
        try {
          const response = await fetch('/api/auth/me', {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          
          if (response.ok) {
            window.location.href = '/admin';
          } else {
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
          }
        } catch (error) {
          localStorage.removeItem('authToken');
          localStorage.removeItem('user');
        }
      }
    });
  </script>
</body>
</html>
